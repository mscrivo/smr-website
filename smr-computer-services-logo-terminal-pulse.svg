<?xml version="1.0" standalone="no"?>
<svg id="custom-brand-svg" width="100%" height="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="max-h-[240px] select-none z-10" style="width: auto; display: block;"><defs><linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#0F172A"/></linearGradient><linearGradient id="grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient><linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient><filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;family=JetBrains+Mono:wght@600;700&amp;family=Orbitron:wght@700;900&amp;family=Outfit:wght@600;700&amp;family=Space+Grotesk:wght@600;700&amp;family=Syne:wght@700;800&amp;display=swap');
      .svg-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        fill: #0EA5E9;
      }
      .svg-tagline {
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        fill: #94A3B8;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .logo-pulse {
        animation: pulseFade 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .logo-rotate {
        transform-origin: center;
        animation: slowRotate 15s linear infinite;
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      @keyframes slowRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style></defs><g><g transform="translate(20, 20) scale(1)"><g stroke="#334155" stroke-width="1" stroke-dasharray="5 5" opacity="0.25"><g><line x1="20" y1="20" x2="20" y2="170"/><line x1="20" y1="20" x2="180" y2="20"/></g><g><line x1="40" y1="20" x2="40" y2="170"/><line x1="20" y1="40" x2="180" y2="40"/></g><g><line x1="60" y1="20" x2="60" y2="170"/><line x1="20" y1="60" x2="180" y2="60"/></g><g><line x1="80" y1="20" x2="80" y2="170"/><line x1="20" y1="80" x2="180" y2="80"/></g><g><line x1="100" y1="20" x2="100" y2="170"/><line x1="20" y1="100" x2="180" y2="100"/></g><g><line x1="120" y1="20" x2="120" y2="170"/><line x1="20" y1="120" x2="180" y2="120"/></g><g><line x1="140" y1="20" x2="140" y2="170"/><line x1="20" y1="140" x2="180" y2="140"/></g><g><line x1="160" y1="20" x2="160" y2="170"/><line x1="20" y1="160" x2="180" y2="160"/></g><g><line x1="180" y1="20" x2="180" y2="170"/><line x1="20" y1="180" x2="180" y2="180"/></g></g><rect x="25" y="30" width="150" height="130" rx="12" ry="12" fill="#090E1A" stroke="url(#grad-secondary)" stroke-width="4" filter="url(#neon-glow)"/><line x1="25" y1="62" x2="175" y2="62" stroke="#1E293B" stroke-width="2"/><circle cx="45" cy="46" r="5" fill="#EF4444"/><circle cx="60" cy="46" r="5" fill="#F59E0B"/><circle cx="75" cy="46" r="5" fill="#10B981"/><g transform="translate(42, 80)"><path d="M 0,0 L 12,8 L 0,16" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/><line class="logo-pulse" x1="18" y1="16" x2="32" y2="16" stroke="#38BDF8" stroke-width="3.5"/></g><path d="M 85,95 L 105,95 L 112,65 L 120,135 L 126,83 L 132,95 L 160,95" fill="none" stroke="url(#grad-primary)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/><circle cx="120" cy="135" r="5" fill="#38BDF8"/><circle cx="112" cy="65" r="5" fill="#38BDF8"/></g></g></svg>